<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Password Validator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="card">


            <div class="input-box">
                <input type="password" placeholder="Password" />
                <img id="eyeImg" src="https://cdn-icons-png.flaticon.com/512/2767/2767146.png" />
            </div>

            <p>Password should be:</p>

            <!-- Conditions -->
            <ul class="conditions">
                <li>
                    <img id="condition1" src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png" />
                    At least 8 characters
                </li>

                <li>
                    <img id="condition2" src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png" />
                    At least one number (0–9)
                </li>

                <li>
                    <img id="condition3" src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png" />
                    At least one lowercase letter (a–z)
                </li>

                <li>
                    <img id="condition4" src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png" />
                    At least one uppercase letter (A–Z)
                </li>

                <li>
                    <img id="condition5" src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png" />
                    At least one special symbol (!@$…)
                </li>
            </ul>

        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
